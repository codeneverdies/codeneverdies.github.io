# =============================================================================
# SITE IDENTITY
# =============================================================================
title = 'codeneverdies!'
baseURL = 'https://codeneverdies.github.io/'
locale = 'en-us'
theme = 'hybrid'

[params]
  author = 'Nasir T'
  avatar = '/images/author.jpg'
  subtitle = 'Game Security · Red teaming · Windows Internals · Vulnerability Research'
  hero = " There’s nothing new under the sun."
  description = 'Research notes on game security, reverse engineering, malware analysis, and low-level systems.'
  email = ''
  github = 'https://github.com/codeneverdies'
  twitter = 'https://x.com/codeneverdies'
  mastodon = ''
  showNumbers = true
# =============================================================================

enableRobotsTXT = true
enableEmoji = false
mainSections = ['posts']
summaryLength = 48

[pagination]
  pagerSize = 24

[outputs]
  home = ['HTML', 'RSS']

[menu]
  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 20
  [[menu.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 25
  [[menu.main]]
    name = 'Categories'
    url = '/categories/'
    weight = 28
  [[menu.main]]
    name = 'Tags'
    url = '/tags/'
    weight = 30

[taxonomies]
  tag = 'tags'
  category = 'categories'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'dracula'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[module]
  [module.hugoVersion]
    extended = true
    min = '0.124.0'